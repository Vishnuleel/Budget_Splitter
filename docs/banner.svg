<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Splitkvitto</title>
  <desc id="d">Split receipts item by item, track spending across currencies, and settle up with friends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9dcf0"/>
      <stop offset="0.5" stop-color="#d4e4f1"/>
      <stop offset="1" stop-color="#dcd6ef"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a6c96" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1170" cy="40" r="120" fill="#ffffff" opacity="0.25"/>
  <circle cx="90" cy="300" r="90" fill="#88c0d0" opacity="0.25"/>

  <!-- logo -->
  <g transform="translate(96 104)" filter="url(#soft)">
    <rect width="112" height="112" rx="34" fill="#4a6c96"/>
    <circle cx="56" cy="56" r="30" fill="#eceff4"/>
    <path d="M56 26 A30 30 0 0 1 56 86 Z" fill="#88c0d0"/>
  </g>

  <text x="240" y="160" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#2e3440">Splitkvitto</text>
  <text x="242" y="208" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#4c566a">Fair receipt splits · two currencies · one-tap settle up</text>

  <!-- mini receipt card -->
  <g transform="translate(930 74)" filter="url(#soft)">
    <rect width="270" height="172" rx="26" fill="url(#card)"/>
    <text x="24" y="40" font-family="Nunito, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#4c566a" letter-spacing="1.5">ICA · 257,40 KR</text>
    <g font-family="Nunito, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#2e3440">
      <text x="24" y="78">Champinjoner</text>
      <text x="24" y="110">Kycklingfilé</text>
      <text x="24" y="142">Schampo</text>
    </g>
    <g>
      <rect x="168" y="62" width="22" height="22" rx="7" fill="#2e3440"/>
      <rect x="198" y="62" width="22" height="22" rx="7" fill="none" stroke="#d8dee9" stroke-width="2"/>
      <rect x="228" y="62" width="22" height="22" rx="7" fill="#b48ead"/>
      <rect x="168" y="94" width="22" height="22" rx="7" fill="#2e3440"/>
      <rect x="198" y="94" width="22" height="22" rx="7" fill="#d08770"/>
      <rect x="228" y="94" width="22" height="22" rx="7" fill="#b48ead"/>
      <rect x="168" y="126" width="22" height="22" rx="7" fill="#2e3440"/>
      <rect x="198" y="126" width="22" height="22" rx="7" fill="none" stroke="#d8dee9" stroke-width="2"/>
      <rect x="228" y="126" width="22" height="22" rx="7" fill="none" stroke="#d8dee9" stroke-width="2"/>
    </g>
  </g>
</svg>
